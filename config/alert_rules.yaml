alerts:
  - name: HighTailLatency
    severity: high
    condition: "latency_p95_ms > 3000 for 5m"
    type: symptom-based
    owner: sre-oncall
    runbook: docs/alerts.md#alert-1-high-tail-latency
  - name: HighErrorRate
    severity: critical
    condition: "error_rate_pct > 2 for 5m"
    type: symptom-based
    owner: sre-oncall
    runbook: docs/alerts.md#alert-2-high-error-rate
  - name: CostBudgetBurn
    severity: warning
    condition: "daily_cost_usd > 2.5 for 15m"
    type: symptom-based
    owner: ai-platform
    runbook: docs/alerts.md#alert-3-cost-budget-burn
